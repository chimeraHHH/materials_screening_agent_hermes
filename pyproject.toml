[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "material-screening-agent"
version = "0.1.0"
description = "Durable material-screening Orchestrator with auditable public-database retrieval."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "emmet-core==0.86.2",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "matplotlib==3.11.1",
  "mp-api==0.45.15",
  "mp-pyrho==0.5.1",
  "pydantic==2.12.5",
  "pymatgen==2025.10.7",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.3",
]
gateway = [
  "mcp==1.28.1",
]
semantic = [
  "sentence-transformers==5.6.1",
]

[project.scripts]
material-agent = "material_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"material_agent.inspiration" = [
  "catalogs/flat_band_parent_catalog_v1/*.cif",
  "catalogs/flat_band_parent_catalog_v1/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live_mp: opt-in Materials Project release test requiring network and MP_API_KEY",
  "live_nomad: opt-in public NOMAD API release test requiring network",
  "live_crossref: opt-in public Crossref metadata API release test requiring network",
  "live_llm: opt-in DeepSeek Stage0 release test requiring network and a secret-store API key",
  "live_semantic_rag: opt-in DeepSeek grounded semantic-RAG release test requiring network and a secret-store API key",
  "real_smact: local independent SMACT worker integration test",
  "real_ml: opt-in Agent02 CPU test using the independent CHGNet environment",
  "slow_real_ml: opt-in Agent02 standard 200-step relaxation test",
  "mps_ml: opt-in Agent02 target-Mac MPS parity and fallback test",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "ASYNC230",
  "B008",
  "B018",
  "B023",
  "BLE001",
  "C401",
  "C408",
  "C409",
  "F401",
  "F821",
  "F841",
  "FURB162",
  "FURB192",
  "I001",
  "ISC004",
  "PERF102",
  "PIE810",
  "PLR0124",
  "PYI034",
  "PYI061",
  "RUF007",
  "RUF012",
  "RUF046",
  "RUF059",
  "S110",
  "SIM102",
  "SIM117",
  "TRY004",
  "UP022",
  "UP035",
  "UP037",
]
