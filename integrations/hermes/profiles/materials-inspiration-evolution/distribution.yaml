name: materials-inspiration-evolution
version: 0.1.0
description: "Approval-gated Hermes-native learning plane for materials inspiration"
hermes_requires: "==0.20.0"

env_requires:
  - name: API_SERVER_KEY
    description: "Bearer key for the loopback Hermes evolution API"
    required: true
  - name: MATERIAL_AGENT_PYTHON
    description: "Absolute path to the isolated Materials Gateway Python"
    required: true
  - name: MATERIAL_AGENT_WORKSPACE
    description: "Absolute path to the bounded material-agent workspace"
    required: true
  - name: MATERIAL_AGENT_PROJECT_ID
    description: "Existing project whose completed results may be reviewed read-only"
    required: true

distribution_owned:
  - distribution.yaml
  - config.yaml
  - SOUL.md
  - .no-bundled-skills
  - skills/materials-inspiration-evolution
